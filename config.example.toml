# Copy to ~/.config/bidradar/config.toml (permissions 600).
# Keep credentials outside the source directory.
[review]
backend = "codex"
model = "gpt-6.1-sol"
daily_limit = 6
max_chars = 8000
timeout_seconds = 240
lookback_days = 15

[schedule]
interval_days = 15
hour = 9
retry_days = 2
max_catchup_days = 45

[capture]
# Daily public RSS caching only. Model review and delivery remain every 15 days.
daily_feeds = ["infoq-articles", "qbitai-articles"]

[brief]
max_items = 20
chars_per_item = 2400
max_input_chars = 28800
max_chars_per_item = 100
max_body_chars = 2000
body_overhead = 100
individual_reviews = 0

[selection]
minimum_score = 70
minimum_relevance = 4
watch_minimum_score = 60
watch_max_age_days = 15
max_watch_items = 1
max_digest_items = 3
digest_hour = 9
timezone = "Asia/Shanghai"

[feishu]
webhook_url = ""
signing_secret = ""
keyword = "出价情报"

[[sources]]
id = "arxiv-bidding"
kind = "arxiv"
query = '(ti:"auto-bidding" OR ti:autobidding OR ti:"generative bidding" OR (ti:bidding AND (abs:advertising OR abs:advertisement)) OR (ti:pacing AND abs:advertising))'
limit = 100

[[sources]]
id = "arxiv-feedback"
kind = "arxiv"
query = '((ti:"delayed feedback" OR ti:"conversion rate" OR ti:"conversion value") AND (abs:advertising OR abs:advertisement))'
limit = 60

[[sources]]
id = "arxiv-industry"
kind = "arxiv"
# Company names are search terms, not verified author affiliations. Global bidding search above is independent.
query = '((all:Tencent OR all:ByteDance OR all:Douyin OR all:TikTok OR all:Kuaishou OR all:Meituan OR all:Alimama) AND (abs:advertising OR abs:advertisement OR ti:bidding OR ti:"conversion rate" OR ti:"delayed feedback"))'
limit = 100
max_pages = 3

# Curated first-party repositories: no API token; commit timestamps are not paper publication dates.
# kuaishou-tech's SegmentFault RSS was removed after repeated HTTP 468 responses.
[[sources]]
id = "alimama-public"
kind = "github_curated"
publisher = "阿里妈妈公开研究仓库（alimama-tech）"
repos = [
  { name = "alimama-tech/ISGE", ref = "main", readme = "README.md" },
  { name = "alimama-tech/AuctionNet", ref = "main", readme = "README.md" },
  { name = "alimama-tech/NeurIPS_Auto_Bidding_AIGB_Track_Baseline", ref = "main", readme = "README.md" },
  { name = "alimama-tech/NeurIPS_Auto_Bidding_General_Track_Baseline", ref = "main", readme = "README.md" },
  { name = "alimama-tech/OnlineGMV", ref = "main", readme = "README.md" },
  { name = "alimama-tech/NetCVR", ref = "main", readme = "README.md" },
]

